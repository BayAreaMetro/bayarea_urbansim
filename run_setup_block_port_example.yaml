# INITIAL SUMMARY YEAR
# the model's initial year is 2010, while this specifies the first reporting year
# generally the initial summary year is the current year, validated with external data
# adter which external forces and strategies are applied
# set to 2010 so the base-year pass emits a 2010 baseline summary and growth
# summaries compute predicted change over 2010 -> final_year (2020)
initial_summary_year: 2010

# RUN NAME
run_name: baus_block_port_03

# RUN DESCRIPTION
# short one-line label for this run, surfaced in the Slack start/completion/failure
# messages (e.g. the manifest addition it introduces)
run_description: "wiring in block hlcm"

annotation: 
   - Run with latest SLR data, from https://app.asana.com/0/1202179257399094/1209744259651545/f
   - Run with DBP pipeline
   - Run with 15% space per worker reduction
   - Run with updated TM logsums v13 (2035) and v14 (2050)
   - Run with empty pipeline table

reference_run: PBA50Plus_NoProject_v38_nopipe
variant: NoProject
vintage: PBA2050Plus

# PATHS FOR INPUTS AND OUTPUTS
inputs_dir: 'M:/urban_modeling/baus/BAUS Inputs'
outputs_dir: 'M:/urban_modeling/baus/FoLUMPP2/baus_block_sandbox'

# OPTIONAL RUN VALIDATION
run_simulation_validation: True 

# OPTIONAL SUMMARY WRITING
run_summaries: True

# OPTIONAL METRICS WRITING
run_metrics: False

# OPTIONAL VISUALIZER
run_visualizer: False
viz_dir: 'M:/urban_modeling/baus/PBA50Plus/BAUS_Visualizer_PBA50Plus_Files'


# CORE CONFIGS
elcm_spec_file: "elcm.yaml"


# EXOGENOUS FORCES
#exog_sqft_per_job_adj_file: sqft_per_job_adjusters_exogenous.csv
exog_sqft_per_job_adj_file: sqft_per_job_adjusters_costar_qcew_timevarying_base_2023_0p85_reduction_dec2024_sd_2035.csv
#exog_sqft_per_job_adj_file: sqft_per_job_adjusters_costar_qcew_timevarying_actual_sd_continuation.csv
#exog_sqft_per_job_adj_file: sqft_per_job_adjusters_costar_qcew_timevarying_base_2023_0p8_reduction_apr_sd.csv
# must be set to false if sqft per job adjusters or telecommute strategy is enabled
use_exogenous_sqft_per_job_adjusters: True
# used for exogenous block to denote if exogenous adjusters should be applied to office only
job_density_adj_office_only: False


# MODEL ADJUSTERS
emp_reloc_rates_adj_file: "employment_relocation_rates_overwrites.csv"
employment_relocation_rates_adjusters: True
sqft_per_job_adj_file: "sqft_per_job_adjusters_exogenous.csv"
# must be set to false if sqft per job exogenous forces or telecommute are enabled
sqft_per_job_adjusters: False
cost_shifters: True
# office caps currently in inputs/plan_strategies/development_caps_strategy.yaml, while residential
# caps are in configs/adjusters/development_caps_asserted.yaml, but may need to be disentangled 
asserted_development_caps: True
residential_vacancy_rate_mods: True


# DEVELOPER GEOGRAPHY
# "parcel" (default) runs the standard parcel-level residential_developer.
# "block" swaps in the block-native block_residential_developer, which allocates
# development to census blocks (LCM-weighted, capped at deliverable capacity) and
# renders the result back down to parcels.
developer_geography: block


# ELCM GEOGRAPHY
# "parcel" (default) runs the standard building-level elcm_simulate.
# "block" swaps in block_elcm_simulate, which chooses a census block from the
# block commercial alternatives table and renders the choice back down to a
# building with vacant job spaces.
elcm_geography: block


# HLCM GEOGRAPHY
# "parcel" (default) runs the standard unit-level HLCM steps.
# "block" swaps in the four block HLCM steps (block_hlcm_owner_simulate,
# block_hlcm_renter_simulate, and their lowincome variants), which choose a
# census block from the block residential alternatives table, render the choice
# down to a vacant unit, and clear prices via supply/demand equilibration. The
# parcel `*_no_unplaced` steps are retained to place any unplaced tail.
hlcm_geography: block


# REGIONAL CONTROL FILES
household_controls_file: "household_controls_PBA50Plus_NP.csv"
employment_controls_file: "employment_controls_PBA50Plus_NP_DBP.csv"


# DEVELOPMENT PIPELINE
#development_pipeline_file: 2024_1026_2234_development_projects_PBA50p_NP.csv
development_pipeline_file: development_pipeline_empty.csv
use_pipeline_filters: False


# ZONING FILES
#zoning_lookup_file: "2024_04_09_zoning_lookup_hybrid_he_MS_pba50plus.csv"
#zoning_lookup_file: 2024_04_09_zoning_lookup_hybrid_he_MSClip_pba50plus.csv
#zoning_file: "2024_04_09_zoning_parcels_hybrid_he_MS_pba50plus.csv"

# updated versions from MS / DL April 26 2024, revised with Calistoga Oct 2024
zoning_file: zoning_parcels_2024-10-14.csv
zoning_lookup_file: zoning_lookup_2024-10-14.csv

# SEA LEVEL RISE
# sea level rise and sea level rise mitigation
# if sea level rise is activated, there is either no project or scenario-based mitigation
run_slr: True
run_slr_summaries: False
slr_inundation_file: "urbansim_slr_no_project_MAR2025.csv"
slr_progression_file: "slr_progression_PBA50Plus.csv"


# EARTHQUAKE
# earthquake and earthquake mitigation
run_eq: False
run_eq_mitigation: False


# LOGSUMS
# the logsum file suffix

#logsum_file: PBA50Plus_DBP_06b
logsum_file1: subzone_logsums_for_BAUS_PBA50Plus_NP_13_2035.csv
logsum_file2: subzone_logsums_for_BAUS_PBA50Plus_NP_14_2050.csv
# the travel model years of the logsums 
logsum_year1: 2035
logsum_year2: 2050
# years in which the logsums are applied to the land use
logsum_period1: [2010, 2015, 2020, 2025]
logsum_period2: [2030, 2035, 2040, 2045, 2050]


# POLICY
